; SplashLoader settings - FIFA 11 custom boot splash
; Put your image in  Game\data\fifarna\  as splash.fsh, splash.dds, splash.png or splash.jpg
; Best: 1920x1080 or 1280x720 (the splash is drawn at 16:9). Any image is converted to DXT1 automatically.

[Splash]
; 1 = custom splash on, 0 = original FIFA 11 splash
Enabled=1

; auto = use the first one found, in this order: fsh > dds > png > jpg
; or force one format: fsh / dds / png / jpg
Format=auto

; Optional: use a specific file instead (relative to the Game folder, or a full path).
; Overrides Format. Handy for keeping several splashes and switching between them.
; File=data\fifarna\splash_winter.png
File=
